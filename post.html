<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nota sobre matemática aplicada e computação." />
    <title>Jean — notas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (err) {}
      })();
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        startup: {
          typeset: false,
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <input
      type="checkbox"
      id="theme-toggle"
      class="theme-toggle-input"
      aria-hidden="true"
    />

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <span class="brand-name">Jean</span>
          <span class="brand-mark">/log</span>
        </a>
        <label class="theme-toggle" for="theme-toggle" aria-label="Alternar tema claro e escuro" title="Alternar tema">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 14.3A8.5 8.5 0 0 1 9.7 3 7 7 0 1 0 21 14.3z"
            />
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.75" />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </label>
      </div>
    </header>

    <main id="conteudo" class="container">
      <article class="article">
        <p class="back-link"><a href="index.html">← timeline</a></p>
        <header class="article-header">
          <time class="post-date" datetime=""></time>
          <h1 class="article-title"></h1>
          <p class="post-tags"></p>
        </header>
        <div class="article-body"></div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Jean. Texto em Markdown; o resto é HTML, CSS e JavaScript.</p>
      </div>
    </footer>
  </body>
</html>
